<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataPulse — Text-to-SQL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <aside id="sidebar">

    <!-- ── Logo ── -->
    <div class="sidebar-logo">
      <div class="logo-row">
        <svg class="logo-icon" width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M8 5 L20 15 L8 25" stroke="#A100FF" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
        </svg>
        <div class="logo-text">
          <div class="logo-name">DataPulse</div>
          <div class="logo-sub">Text-to-SQL</div>
        </div>
      </div>
      <div class="logo-tagline">Ask your enterprise data in plain English.</div>
      <div class="tech-badges">
        <span class="badge">Neo4j</span>
        <span class="badge">LLaMA-3.3-70b</span>
        <span class="badge">Groq</span>
      </div>
      <div class="kg-status">
        <span id="kg-dot" class="kg-dot connecting"></span>
        <span id="kg-label" class="kg-label">Connecting…</span>
      </div>
    </div>

    <!-- ── Domains ── -->
    <div class="sidebar-section">
      <div class="section-head">
        <span class="eyebrow">Knowledge Graph</span>
        <span class="section-count" id="domain-count">5 domains</span>
      </div>
      <div id="domains-list"></div>
    </div>

    <!-- ── Recent ── -->
    <div class="sidebar-section sidebar-recent">
      <div class="section-head">
        <span class="eyebrow">Recent Queries</span>
        <button class="clear-btn" id="clear-btn" title="Clear history">Clear</button>
      </div>
      <div id="recent-list"><span class="empty-recent">No queries yet</span></div>
    </div>

    <!-- ── Activity ── -->
    <div class="sidebar-log">
      <div class="log-header">
        <span class="eyebrow">Activity</span>
        <span class="log-live"><span class="live-dot"></span>LIVE</span>
      </div>
      <div id="log-list" class="log-list">
        <div class="log-entry log-info">
          <span class="log-time">--:--:--</span>
          <span class="log-prefix" style="color:#6B6B78">SYS</span>
          <span class="log-msg">Ready.</span>
        </div>
      </div>
    </div>

    <!-- ── Footer ── -->
    <div class="sidebar-footer">
      <span>50 tables</span>
      <span class="footer-sep">·</span>
      <span>373 embeddings</span>
      <span class="footer-sep">·</span>
      <span>23k rows</span>
    </div>
  </aside>

  <main id="main">
    <div id="chat-window">
      <div id="messages"></div>
    </div>
    <div id="input-area">
      <div id="input-box">
        <span id="prompt-glyph" class="prompt-glyph">&gt;_</span>
        <textarea id="query-input"
          placeholder="Ask anything about your enterprise data in plain English…"
          rows="1" autocomplete="off" spellcheck="false"></textarea>
        <button id="send-btn" title="Send query (Enter)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 13V3M3 8l5-5 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <div class="input-hint">
        <kbd>Enter</kbd> send &nbsp;·&nbsp; <kbd>Shift+Enter</kbd> new line &nbsp;·&nbsp;
        <span id="query-counter">0 queries</span>
      </div>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
