[project]
name = "datapulse"
version = "0.1.0"
description = "Knowledge Graph Based Querying on Sales Data"
requires-python = ">=3.10"
dependencies = [
    "aiofiles>=23.0",
    "faker>=40.15.0",
    "fastapi>=0.111.0",
    "google-adk>=1.33.0",
    "groq>=0.9.0",
    "neo4j>=6.2.0",
    "pandas>=2.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.15.3",
    "sentence-transformers>=3.0",
    "streamlit>=1.35",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "matplotlib>=3.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
