[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse"
version = "0.1.0"
description = "Knowledge Graph Based Querying on Sales Data"
requires-python = ">=3.10"
dependencies = [
    "faker>=40.15.0",
    "networkx>=3.0",
    "pandas>=2.0",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.0"]
gemini = ["google-genai>=1.0", "python-dotenv>=1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
