[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datapulse"
version = "0.1.0"
description = "Knowledge Graph Based Querying on Sales Data"
requires-python = ">=3.10"
dependencies = [
    "faker>=40.15.0",
    "google-adk>=1.33.0",
    "neo4j>=6.2.0",
    "pandas>=2.0",
    "python-dotenv>=1.2.2",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
