services:
  - type: web
    name: synapse-ai
    env: python
    plan: free
    # Pre-download the embedding model at build time so first request is fast
    buildCommand: pip install -r requirements.txt && python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
